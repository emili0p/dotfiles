; GLOBAL
[global/wm]
margin-top = 0
margin-bottom = 0

; COLORS
[colors]
background = ${xrdb:color0:#222222}
background-alt = ${xrdb:color8:#444444}

foreground = ${xrdb:color7:#dddddd}
foreground-alt = ${xrdb:color15:#ffffff}

primary = ${xrdb:color1:#81a1c1}
secondary = ${xrdb:color2:#bf616a}
alert = ${xrdb:color3:#ebcb8b}
disabled = ${xrdb:color8:#6c7086}

; BAR
[bar/main]
width = 100%
height = 28

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

padding-left = 2
padding-right = 2
module-margin = 2

font-0 = Iosevka Nerd Font:size=10;2
font-1 = Noto Color Emoji:size=10;2

enable-ipc = true
wm-restack = i3
override-redirect = false

modules-left = i3
modules-center = date
modules-right = cpu memory pulseaudio network tray

cursor-click = pointer
cursor-scroll = ns-resize

; MODULES

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

label-focused = %index%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.background-alt}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.secondary}
label-visible-padding = 2

label-urgent = %index%!
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

; =====================================================

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d
time = %H:%M

label =   %date% %time%

; =====================================================

[module/cpu]
type = internal/cpu
interval = 2

label =   %percentage%%

; =====================================================

[module/memory]
type = internal/memory
interval = 2

label =   %used%/%total%

; =====================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume =   %percentage%%

label-muted =   muted
label-muted-foreground = ${colors.alert}

; =====================================================

[module/network]
type = internal/network
interface-type = wireless
interval = 3

format-connected = <label-connected>
label-connected =   %essid%

format-disconnected = <label-disconnected>
label-disconnected =   offline
label-disconnected-foreground = ${colors.alert}

; =====================================================

[module/tray]
type = internal/tray
tray-size = 70%
tray-padding = 2

; SETTINGS
[settings]
screenchange-reload = true
pseudo-transparency = false

